<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="edGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="128" height="128" rx="32" fill="url(#edGrad)"/>
  <rect x="3" y="3" width="122" height="122" rx="29" fill="none" stroke="#f59e0b" stroke-width="4" stroke-opacity="0.35"/>
  
  <!-- Monogram ED -->
  <text x="64" y="81" font-family="'Archivo', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="54" font-weight="900" letter-spacing="-2" text-anchor="middle">
    <tspan fill="#ffffff">E</tspan><tspan fill="url(#goldGrad)">D</tspan>
  </text>
  
  <!-- Accent Dot -->
  <circle cx="101" cy="36" r="5" fill="#f59e0b"/>
</svg>
